<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETPИC — 1984</title>
  <meta name="description" content="Terminal-style Tetris, in the spirit of the original 1984 Electronika 60 version." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="crt">
    <div class="terminal">
      <pre id="screen" aria-label="Tetris playfield"></pre>
    </div>
    <p class="hint">
      &larr; &rarr; move &nbsp;&middot;&nbsp; &uarr; / Z rotate &nbsp;&middot;&nbsp; &darr; soft drop
      &nbsp;&middot;&nbsp; SPACE hard drop &nbsp;&middot;&nbsp; P pause &nbsp;&middot;&nbsp; R restart
    </p>
  </div>
  <script src="tetris.js"></script>
</body>
</html>
